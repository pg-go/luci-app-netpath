<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetPath 仪表盘</title>
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>
<main id="app">
<header class="head">
<h1>NetPath 仪表盘</h1>
<p class="sub"><span id="device">—</span> · <span id="updated">—</span></p>
<p class="warn">只读查看：只能看仪表盘，不能改任何设置，也进不了其他页面。本页没有密码，谁能打开这个端口，谁就能看到下面的设备信息。</p>
</header>
<section class="card" id="health"><h2>设备</h2><div id="health-body">加载中…</div></section>
<section class="card" id="uplink"><h2>上行</h2><div id="uplink-body">加载中…</div></section>
<section class="card" id="wifi"><h2>WiFi</h2><div id="wifi-body">加载中…</div></section>
<section class="card" id="wired"><h2>有线</h2><div id="wired-body">加载中…</div></section>
<footer class="foot">NetPath 独立版 · 5 秒刷新一次 · 数据只读，来自本机 ubus</footer>
</main>
<noscript><p>需要开 JavaScript 才能看仪表盘。</p></noscript>
</body>
</html>
